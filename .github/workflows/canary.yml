# Moves tags through every Refledger §6.2 pattern and appends ground truth
# to canary/ledger.jsonl. Every third-party action is pinned by SHA.
#
# performed_at is stamped AFTER git push returns (finalize-ledger.sh), not when
# the cron fires; scheduled workflows start late under load, and we'd otherwise
# be timing GitHub's queue rather than detection.
#
# Triggered by refledger-clock (Cloudflare Worker) via workflow_dispatch every
# 4 hours at minute 17. No Actions `schedule:` here: that scheduler was
# unreliable and would double-fire once the external clock is live.
name: canary-rotate

on:
  workflow_dispatch:
    inputs:
      force_pattern:
        description: "Optional pattern name to run once"
        required: false

# Least privilege at the workflow root. The rotate job elevates for pushes.
permissions:
  contents: read

concurrency:
  group: canary-rotate
  cancel-in-progress: false

jobs:
  rotate:
    name: rotate
    runs-on: ubuntu-24.04
    # contents: write is required to push rotated tags and main.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "refledger-canary"
          git config user.email "canary@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Rotate pattern
        env:
          FORCE_PATTERN: ${{ inputs.force_pattern }}
        run: bash scripts/rotate.sh

      - name: Push tags and commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          git push origin --tags --force
          # --tags does not delete. Propagate local absences for the canary set
          # so delete/recreate halves are visible to the poller.
          for t in v1 v1.0.0 v1.0.1 v2 v3.0.0 v9.0.0 v9.0.1 v9.0.2; do
            if ! git rev-parse -q --verify "refs/tags/${t}" >/dev/null 2>&1; then
              git push origin ":refs/tags/${t}" || true
            fi
          done

      - name: Record performed_at after push
        run: bash scripts/finalize-ledger.sh
